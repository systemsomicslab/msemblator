# Settings for the SIRIUS-free formula model (MSBuddy + FIDDLE + MS-FINDER).
# This file is independent of msemblator_parameter_file.yaml and of models/formula.
# Use single quotes for Windows paths.

annotation:
  # Tools to run; remove one to skip it.
  tools: [msbuddy, msfinder, fiddle]

  msbuddy:            # same settings as formula_prediction.msbuddy of the default workflow
    MS1_ppm: 10
    MS2_ppm: 20
    halogen: true
    timeout_secs: 600
    batch_size: 1000
    top_n: 100

  msfinder:           # same settings as formula_prediction.msfinder of the default workflow
    MS1_ppm: 10
    MS2_ppm: 20
    halogen: true
    top_n: 100
    msfinder_dir: null      # null: external/msfinder/MSFINDER*
    param_template: null    # null: config/msfinder/MsfinderConsoleApp_Param_formula.txt

  fiddle:
    # FIDDLE runs in the MS-Emblator environment (environment.yml installs msfiddle).
    # Only when it is installed in another environment instead: that environment's
    # name, or its python.exe (e.g. 'C:\Users\me\.conda\envs\fiddle\python.exe').
    conda_env: null
    python: null
    # Collision energy (eV) for spectra without one; null = skip them (policy A, used
    # for the training data). override_collision_energy: true uses it for every spectrum.
    default_collision_energy: null
    override_collision_energy: false
    device: cpu
    batch_size: 32
    chunk_size: 512
    top_k: 100
    # Spectra without COLLISION_ENERGY are not sent to FIDDLE (status
    # missing_collision_energy); no default energy is substituted.
    # Spectra whose instrument is not recognised are skipped unless this is set
    # to qtof, orbitrap or timstof.
    default_instrument: qtof
