formula_prediction:
  msfinder:
    MS1_ppm: 10
    MS2_ppm: 20
    halogen: True #True or False

  sirius:
  #  possible options: orbitrap, qtof
    MS1: qtof
    MS2_ppm: 20
    halogen: True #True or False

  msbuddy:
    MS1_ppm: 10
    MS2_ppm: 20
    halogen: True #True or False

  fiddle:
    # Used when FIDDLE is selected (--formula_tools fiddle or all). FIDDLE runs in the
    # MS-Emblator environment (environment.yml installs it). Only to run it in another
    # environment instead, give that environment's name or python.exe (single quotes).
    conda_env: null
    python: null
    device: cpu
    batch_size: 32
    chunk_size: 512
    top_k: 100
    # Collision energy (eV) for spectra whose MSP record has none; null skips them.
    default_collision_energy: 30
    # true: use default_collision_energy for every spectrum, also when the MSP has one.
    # (msemblator --fiddle_ce <eV> does this for one run and takes priority over both.)
    override_collision_energy: false
    # Spectra whose instrument is not recognised use this model (qtof, orbitrap or
    # timstof); null skips them.
    default_instrument: qtof

  msemblator_output_records: 100

structure_prediction:
  msfinder:
    MS1_ppm: 5
    MS2_ppm: 20
    halogen: True #True or False

  sirius:
    MS2_ppm: 20

  metfrag:
  # MetFrag uses whichever tolerance is larger: absolute (Da) or relative (ppm)
    MS2_Da: 0.01
    MS2_ppm: 20

  msemblator_output_records: 100