[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "msemblator"
version = "0.1.0"
description = "Ensemble metabolomics annotation pipeline"
readme = "README.md"
requires-python = ">=3.10"
dynamic = ["dependencies"]

[project.scripts]
msemblator = "msemblator.cli.msemblator:main"

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.package-data]
msemblator = ["*.yaml"]
