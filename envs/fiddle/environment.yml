# FIDDLE (msfiddle) environment for the SIRIUS-free formula model.
#   Create  : conda env create -f envs/fiddle/environment.yml
#   Weights : conda run -n msemblator-fiddle msfiddle download
#   Check   : conda run -n msemblator-fiddle python scripts/sirius_free/check_fiddle_install.py
# Kept separate from the main msemblator environment so that torch and the
# newer pandas/scikit-learn required here do not change the main environment.
name: msemblator-fiddle
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - pip:
      - -r requirements-fiddle.txt
variables:
  PYTHONNOUSERSITE: "1"
  PYTHONUTF8: "1"
